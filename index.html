<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De-Corporate AI (OpenAI Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between font-sans">

<header class="p-6 border-b border-gray-900 text-center">
    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600">
        Corporate to Real Talk 🧢
    </h1>
    <p class="text-gray-400 mt-2">Powered by OpenAI. Paste terms-of-service or boring emails for the real truth.</p>
</header>

<main class="flex-1 max-w-6xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">

    <div class="flex flex-col space-y-4">
        <label class="font-bold text-cyan-400">Boring Adult Jargon:</label>
        <textarea id="inputText" class="flex-1 w-full p-4 bg-gray-900 border border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 text-gray-200 resize-none min-h-[300px]" placeholder="Paste contract text, corporate updates, or TOS agreements here..."></textarea>

        <div class="flex space-x-4">
            <select id="toneSelect" class="bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <option value="plain">Plain English 🥱</option>
                <option value="brutal">Brutally Honest 💀</option>
                <option value="slang">Gen-Z Slang 🛹</option>
            </select>
            <button id="translateBtn" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 font-bold py-3 px-6 rounded-xl transition duration-200 shadow-lg">
                Translate to Real Talk ✨
            </button>
        </div>
    </div>

    <div class="flex flex-col space-y-4">
        <label class="font-bold text-blue-400">What they actually mean:</label>
        <div id="outputText" class="flex-1 w-full p-4 bg-gray-900 border border-gray-800 rounded-xl overflow-y-auto whitespace-pre-line min-h-[300px] text-gray-300">
            <span class="text-gray-600 italic">The real talk will appear here...</span>
        </div>
    </div>

</main>

<footer class="p-4 text-center text-xs text-gray-700 border-t border-gray-900">
    Don't break the law based on an app built over a single weekend!
</footer>

<script>
    document.getElementById('translateBtn').addEventListener('click', async () => {
        const text = document.getElementById('inputText').value;
        const tone = document.getElementById('toneSelect').value;
        const outputDiv = document.getElementById('outputText');

        if (!text.trim()) {
            alert("Please paste some text first!");
            return;
        }

        // Show a loading state
        outputDiv.innerHTML = '<span class="text-cyan-400 animate-pulse">Running the text through the legal filter...</span>';

        try {
            // Send data to our local Node.js server
            const response = await fetch('http://localhost:3000/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, tone })
            });

            const data = await response.json();

            if (response.ok) {
                outputDiv.textContent = data.translation;
            } else {
                outputDiv.innerHTML = `<span class="text-red-500">Error: ${data.error}</span>`;
            }
        } catch (error) {
            outputDiv.innerHTML = '<span class="text-red-500">Could not connect to the backend server. Did you remember to start server.js?</span>';
        }
    });
</script>
</body>
</html>
